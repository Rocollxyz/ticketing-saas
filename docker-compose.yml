# Infraestructura local de desarrollo — idéntica a producción (§3 ARCHITECTURE.md).
# Postgres con RLS y Redis para timers/pub-sub del motor de reserva.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: postgres
      # En un servidor, POSTGRES_PASSWORD en el .env (Compose lo lee solo).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Solo en 127.0.0.1: Docker se salta el firewall (ufw) y, publicado en 0.0.0.0,
    # Postgres quedaría abierto a internet en el VPS.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
